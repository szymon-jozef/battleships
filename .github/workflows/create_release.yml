name: "Create new release"

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "What type of release is this?"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major


permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Version bump 
        id: version
        working-directory: .github/workflows
        run: python3 version_bump.py ${{inputs.bump_type}}

      - name: Push changes
        uses: stefanzweifel/git-auto-commit-action@v7

      - name: Create release
        run: gh release create "v${{steps.version.outputs.new_version}}" --generate-notes -p # remove -p when we exit pre-release
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
