name: Style check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install tools
        run: sudo apt update -y && sudo apt install -y cppcheck fd-find

      - name: cppcheck
        run: cppcheck --enable=all --error-exitcode=1 .

      - name: clang-format
        run: fdfind --type file --extension cpp --extension hpp --exec clang-format --dry-run -Werror
